<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員後台系統 - Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 圖示庫 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { 
            width: 260px; 
            min-height: 100vh; 
            background-color: #212529; 
            flex-shrink: 0;
        }
        .nav-link { 
            color: #adb5bd; 
            margin-bottom: 0.4rem; 
            white-space: nowrap; 
            font-size: 15px;
        }
        .nav-link:hover, .nav-link.active { color: #fff; background-color: #0d6efd; }
        .main-content { flex-grow: 1; overflow-x: hidden; }
        .card { border: none; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .table-responsive { background-color: #fff; border-radius: 0.5rem; }
        .text-truncate-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .admin-prod-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; }
        .admin-category-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .admin-cat-btn { padding: 8px 18px; background-color: #fff; border: 1px solid #cbd5e1; border-radius: 30px; font-size: 14px; font-weight: bold; color: #475569; cursor: pointer; transition: all 0.2s; }
        .admin-cat-btn:hover { border-color: #0d6efd; color: #0d6efd; }
        .admin-cat-btn.active { background-color: #0d6efd; color: #fff; border-color: #0d6efd; box-shadow: 0 3px 8px rgba(13, 110, 253, 0.25); }
        .preview-thumb-box { position: relative; display: inline-block; margin-right: 8px; margin-bottom: 8px; }
        .preview-thumb-box img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #dee2e6; }
        .preview-thumb-box .btn-remove-thumb { position: absolute; top: -6px; right: -6px; padding: 0.1rem 0.3rem; font-size: 0.6rem; border-radius: 50%; }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- 側邊選單 Sidebar -->
    <nav class="sidebar p-3 d-md-block collapse">
        <h4 class="text-white text-center mb-4"><i class="fa-solid fa-gears me-2"></i>後台管理</h4>
        <ul class="nav nav-pills flex-column" id="adminTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link w-100 text-start active" id="products-tab" data-bs-toggle="tab" data-bs-target="#products" type="button" role="tab">
                    <i class="fa-solid fa-boxes-stacked me-2"></i>商品與類別管理
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link w-100 text-start" id="orders-tab" data-bs-toggle="tab" data-bs-target="#orders" type="button" role="tab">
                    <i class="fa-solid fa-cart-shopping me-2"></i>前台商品訂單
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link w-100 text-start" id="repair-tab" data-bs-toggle="tab" data-bs-target="#repair" type="button" role="tab">
                    <i class="fa-solid fa-wrench me-2"></i>維修諮詢申請
                </button>
            </li>
        </ul>
    </nav>

    <!-- 主要內容區 Main Content -->
    <main class="main-content p-4">
        <div class="tab-content" id="adminTabContent">
            
            <!-- 商品與類別管理 -->
            <div class="tab-pane fade show active" id="products" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fa-solid fa-box-open me-2 text-primary"></i>前台商品與類別管理</h2>
                    <div>
                        <button class="btn btn-outline-secondary me-2" data-bs-toggle="modal" data-bs-target="#categoryModal">
                            <i class="fa-solid fa-list me-1"></i>管理商品類別
                        </button>
                        <button class="btn btn-primary" onclick="openProductModal()">
                            <i class="fa-solid fa-plus me-1"></i>新增商品
                        </button>
                    </div>
                </div>

                <!-- 類別篩選分頁按鈕列 -->
                <div class="admin-category-tabs" id="adminCategoryTabsContainer"></div>

                <!-- 商品列表表格 -->
                <div class="table-responsive p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>圖片 (封面/多圖)</th>
                                <th>商品名稱</th>
                                <th>所屬類別</th>
                                <th>價格</th>
                                <th>規格/款式與價格</th>
                                <th>銷量</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 顧客購買訂單管理 -->
            <div class="tab-pane fade" id="orders" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2><i class="fa-solid fa-bag-shopping me-2 text-primary"></i>顧客購買訂單</h2>
                </div>
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card p-3 bg-primary text-white">
                            <h5>總訂單數</h5>
                            <h3 id="totalOrdersCount">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card p-3 bg-success text-white">
                            <h5>總銷售金額</h5>
                            <h3 id="totalSalesAmount">$0</h3>
                        </div>
                    </div>
                </div>
                <div class="table-responsive p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>訂單編號</th>
                                <th>顧客資料</th>
                                <th>購買商品明細</th>
                                <th>總金額</th>
                                <th>購買時間</th>
                                <th>訂單狀態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="orderTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- 維修諮詢管理 -->
            <div class="tab-pane fade" id="repair" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2><i class="fa-solid fa-screwdriver-wrench me-2 text-warning"></i>維修諮詢單據</h2>
                </div>
                <div class="table-responsive p-3">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>諮詢單號</th>
                                <th>顧客姓名</th>
                                <th>聯絡電話</th>
                                <th>諮詢項目與時段</th>
                                <th>故障摘要</th>
                                <th>申請時間</th>
                                <th>處理狀態</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="repairTableBody"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- 新增/編輯 商品 Modal 彈窗 -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold" id="productModalTitle">新增商品</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="prodEditId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">商品名稱</label>
                        <input type="text" class="form-control" id="prodName" required placeholder="請輸入商品名稱">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">商品類別</label>
                            <select class="form-select" id="prodCategory" required></select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">預設價格 (NT$)</label>
                            <input type="number" class="form-control" id="prodPrice" required min="0">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-bold">初始銷量 (熱銷排序用)</label>
                            <input type="number" class="form-control" id="prodSales" value="100" min="0">
                        </div>
                    </div>
                    
                    <!-- 規格設定 -->
                    <div class="mb-3 p-3 border rounded bg-light">
                        <label class="form-label fw-bold text-primary"><i class="fa-solid fa-tags me-1"></i> 商品規格 / 款式與價格設定</label>
                        <div class="row g-2 mb-2">
                            <div class="col-md-7">
                                <input type="text" class="form-control" id="newSpecNameInput" placeholder="規格名稱 (例如：標準規格、禮盒裝)">
                            </div>
                            <div class="col-md-3">
                                <input type="number" class="form-control" id="newSpecPriceInput" placeholder="此規格價格" min="0">
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-outline-primary w-100" type="button" onclick="addSpecOption()">新增</button>
                            </div>
                        </div>
                        <div id="specsContainer" class="d-flex flex-wrap gap-2 mt-2"></div>
                    </div>

                    <!-- 多圖輪播設定區 -->
                    <div class="mb-3 p-3 border rounded bg-light">
                        <label class="form-label fw-bold text-success"><i class="fa-solid fa-images me-1"></i> 商品多圖輪播設定 (第一張將自動作為封面圖片)</label>
                        <div class="input-group mb-2">
                            <input type="file" class="form-control" id="prodImageFile" accept="image/*" multiple onchange="handleImageFiles(event)">
                            <button class="btn btn-outline-success" type="button" onclick="addImgUrlInput()">加入圖片網址</button>
                        </div>
                        <div class="input-group mb-2">
                            <input type="text" class="form-control" id="prodImgUrlInput" placeholder="或者貼上單張圖片網址 (URL) 點擊右側加入">
                            <button class="btn btn-outline-secondary" type="button" onclick="addImgUrlManual()">加入</button>
                        </div>
                        <div class="form-text text-muted mb-2">您可以上傳或新增多张圖片，供客人在前台商品詳情頁透過滑動式輪播欣賞[cite: 11]。</div>
                        <div id="imagePreviewContainer" class="d-flex flex-wrap mt-2"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">商品內容 / 詳細介紹</label>
                        <textarea class="form-control" id="prodDescription" rows="4" placeholder="請輸入商品詳細說明與規格..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveProduct()">儲存上架</button>
            </div>
        </div>
    </div>
</div>

<!-- 管理商品類別 Modal 彈窗 -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-secondary text-white">
                <h5 class="modal-title fw-bold">管理商品類別</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" id="newCategoryName" placeholder="輸入新類別名稱...">
                    <button class="btn btn-success" type="button" onclick="addCategory()">新增類別</button>
                </div>
                <hr>
                <ul class="list-group" id="categoryListGroup"></ul>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">關閉</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const defaultCategories = ["烘焙與茶飲", "生活用品", "水電五金"];
    const defaultProducts = [
        {
            id: 1,
            name: "招牌手作烘焙麵包",
            category: "烘焙與茶飲",
            price: 120,
            sales: 350,
            specs: [
                { name: "標準規格", price: 120 },
                { name: "禮盒裝", price: 180 }
            ],
            img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=80",
            images: [
                "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=500&q=80",
                "https://images.unsplash.com/photo-1549931319-a545dcf3bc73?auto=format&fit=crop&w=500&q=80",
                "https://images.unsplash.com/photo-1589367920969-ab8e050bbb04?auto=format&fit=crop&w=500&q=80"
            ],
            description: "嚴選優質小麥與天然酵母手作烘焙，口感鬆軟香氣濃郁。"
        },
        {
            id: 2,
            name: "精緻手作手工餅乾禮盒",
            category: "烘焙與茶飲",
            price: 250,
            sales: 210,
            specs: [
                { name: "標準規格", price: 250 },
                { name: "特惠組合包", price: 450 }
            ],
            img: "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=500&q=80",
            images: [
                "https://images.unsplash.com/photo-1558961363-fa8fdf82db35?auto=format&fit=crop&w=500&q=80",
                "https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?auto=format&fit=crop&w=500&q=80"
            ],
            description: "手工精心製作，送禮自用兩相宜。"
        },
        {
            id: 3,
            name: "冷泡蕎麥特調茶飲 (瓶裝)",
            category: "烘焙與茶飲",
            price: 60,
            sales: 180,
            specs: [
                { name: "標準規格", price: 60 }
            ],
            img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=80",
            images: [
                "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=500&q=80"
            ],
            description: "嚴選黃金蕎麥冷泡萃取，無咖啡因清香解膩。"
        }
    ];

    let currentAdminCategory = 'all';
    let currentEditingSpecs = [];
    let currentEditingImages = []; // 用於儲存編輯中的多圖陣列

    function getStoredCategories() {
        const data = localStorage.getItem('shop_categories');
        return data ? JSON.parse(data) : defaultCategories;
    }

    function saveStoredCategories(cats) {
        localStorage.setItem('shop_categories', JSON.stringify(cats));
    }

    function getStoredProducts() {
        const data = localStorage.getItem('shop_products');
        if (!data) return defaultProducts;
        let products = JSON.parse(data);
        // 相容舊資料格式：若無 images 陣列則自動把 img 轉為陣列
        return products.map(p => ({
            ...p,
            images: (p.images && p.images.length > 0) ? p.images : [p.img || 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80']
        }));
    }

    function saveStoredProducts(prods) {
        localStorage.setItem('shop_products', JSON.stringify(prods));
    }

    function renderAdminCategoryTabs() {
        const container = document.getElementById('adminCategoryTabsContainer');
        const categories = getStoredCategories();

        let html = `<button type="button" class="admin-cat-btn ${currentAdminCategory === 'all' ? 'active' : ''}" onclick="filterAdminCategory('all', this)">🔥 全部商品</button>`;
        categories.forEach(cat => {
            html += `<button type="button" class="admin-cat-btn ${currentAdminCategory === cat ? 'active' : ''}" onclick="filterAdminCategory('${cat}', this)">🛠️ ${cat}</button>`;
        });
        container.innerHTML = html;
    }

    function filterAdminCategory(categoryName, btnElement) {
        currentAdminCategory = categoryName;
        document.querySelectorAll('.admin-cat-btn').forEach(btn => btn.classList.remove('active'));
        if(btnElement) btnElement.classList.add('active');
        renderAdminProducts(categoryName);
    }

    function renderAdminProducts(category = currentAdminCategory) {
        let products = getStoredProducts();
        const tbody = document.getElementById('adminProductTableBody');
        tbody.innerHTML = '';

        if (category !== 'all') {
            products = products.filter(p => p.category === category);
        }

        if (products.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">此類別目前尚無商品！</td></tr>`;
            return;
        }

        products.forEach(prod => {
            const specsHtml = (prod.specs && prod.specs.length > 0) 
                ? prod.specs.map(s => `<span class="badge bg-secondary me-1">${s.name} ($${s.price})</span>`).join('') 
                : '<span class="text-muted small">無特殊規格</span>';

            const coverImg = (prod.images && prod.images.length > 0) ? prod.images[0] : prod.img;
            const imgCountBadge = (prod.images && prod.images.length > 1) ? `<br><span class="badge bg-success mt-1" style="font-size:0.65rem;">${prod.images.length}張圖</span>` : '';

            tbody.innerHTML += `
                <tr>
                    <td>
                        <img src="${coverImg}" class="admin-prod-img" onerror="this.src='https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=200&q=80'">
                        ${imgCountBadge}
                    </td>
                    <td><strong>${prod.name}</strong><br><small class="text-muted text-truncate-2" style="max-width: 250px;">${prod.description || ''}</small></td>
                    <td><span class="badge bg-info text-dark">${prod.category}</span></td>
                    <td class="text-success fw-bold">$${prod.price}</td>
                    <td>${specsHtml}</td>
                    <td>${prod.sales}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openProductModal(${prod.id})"><i class="fa-solid fa-pen"></i> 編輯</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${prod.id})"><i class="fa-solid fa-trash"></i> 刪除</button>
                    </td>
                </tr>
            `;
        });
        updateCategoryDropdowns();
    }

    function updateCategoryDropdowns() {
        const categories = getStoredCategories();
        const select = document.getElementById('prodCategory');
        select.innerHTML = '';
        categories.forEach(cat => {
            select.innerHTML += `<option value="${cat}">${cat}</option>`;
        });

        const listGroup = document.getElementById('categoryListGroup');
        listGroup.innerHTML = '';
        categories.forEach(cat => {
            listGroup.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${cat}
                    <button class="btn btn-sm btn-danger" onclick="deleteCategory('${cat}')">刪除</button>
                </li>
            `;
        });
    }

    function addCategory() {
        const input = document.getElementById('newCategoryName');
        const catName = input.value.trim();
        if (!catName) return alert('請輸入類別名稱！');
        
        let categories = getStoredCategories();
        if (categories.includes(catName)) return alert('該類別已存在！');

        categories.push(catName);
        saveStoredCategories(categories);
        input.value = '';
        renderAdminCategoryTabs();
        updateCategoryDropdowns();
        alert('新增類別成功！');
    }

    function deleteCategory(catName) {
        let categories = getStoredCategories();
        if (categories.length <= 1) return alert('至少需保留一個類別！');
        categories = categories.filter(c => c !== catName);
        saveStoredCategories(categories);
        renderAdminCategoryTabs();
        updateCategoryDropdowns();
        filterAdminCategory('all');
    }

    function renderSpecsContainer() {
        const container = document.getElementById('specsContainer');
        if (currentEditingSpecs.length === 0) {
            container.innerHTML = `<span class="text-muted small">尚未新增任何規格款式</span>`;
            return;
        }
        container.innerHTML = currentEditingSpecs.map((spec, index) => `
            <span class="badge bg-primary d-inline-flex align-items-center p-2 fs-6 shadow-sm" style="cursor: pointer;" title="點擊以編輯此規格" onclick="editSpecOption(${index})">
                <i class="fa-solid fa-pen-to-square me-1" style="font-size: 0.8rem;"></i> ${spec.name} ($${spec.price})
                <button type="button" class="btn-close btn-close-white ms-2" style="font-size: 0.7rem;" title="刪除" onclick="event.stopPropagation(); removeSpecOption(${index})"></button>
            </span>
        `).join('');
    }

    function addSpecOption() {
        const nameInput = document.getElementById('newSpecNameInput');
        const priceInput = document.getElementById('newSpecPriceInput');
        const nameVal = nameInput.value.trim();
        const priceVal = Number(priceInput.value);

        if (!nameVal || isNaN(priceVal)) return alert('請輸入完整的規格名稱與價格！');
        if (currentEditingSpecs.some(s => s.name === nameVal)) return alert('此規格名稱已存在！');
        
        currentEditingSpecs.push({ name: nameVal, price: priceVal });
        nameInput.value = '';
        priceInput.value = '';
        renderSpecsContainer();
    }

    function editSpecOption(index) {
        const spec = currentEditingSpecs[index];
        document.getElementById('newSpecNameInput').value = spec.name;
        document.getElementById('newSpecPriceInput').value = spec.price;
        currentEditingSpecs.splice(index, 1);
        renderSpecsContainer();
    }

    function removeSpecOption(index) {
        currentEditingSpecs.splice(index, 1);
        renderSpecsContainer();
    }

    // 渲染多圖預覽清單
    function renderImagePreviewContainer() {
        const container = document.getElementById('imagePreviewContainer');
        if (currentEditingImages.length === 0) {
            container.innerHTML = `<span class="text-muted small">尚未新增任何輪播照片</span>`;
            return;
        }
        container.innerHTML = currentEditingImages.map((imgUrl, index) => `
            <div class="preview-thumb-box">
                <img src="${imgUrl}" alt="預覽圖 ${index+1}">
                ${index === 0 ? '<span class="position-absolute bottom-0 start-0 badge bg-primary" style="font-size:0.55rem;">封面</span>' : ''}
                <button type="button" class="btn btn-danger btn-remove-thumb" onclick="removeImage(${index})"><i class="fa-solid fa-xmark"></i></button>
            </div>
        `).join('');
    }

    function handleImageFiles(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const reader = new FileReader();
            reader.onload = function(e) {
                currentEditingImages.push(e.target.result);
                renderImagePreviewContainer();
            }
            reader.readAsDataURL(file);
        }
        event.target.value = ''; // 清空檔案 input
    }

    function addImgUrlManual() {
        const input = document.getElementById('prodImgUrlInput');
        const url = input.value.trim();
        if (!url) return alert('請輸入圖片網址！');
        currentEditingImages.push(url);
        input.value = '';
        renderImagePreviewContainer();
    }

    function removeImage(index) {
        currentEditingImages.splice(index, 1);
        renderImagePreviewContainer();
    }

    function openProductModal(id = null) {
        updateCategoryDropdowns();
        const modalTitle = document.getElementById('productModalTitle');
        document.getElementById('prodEditId').value = '';
        document.getElementById('prodName').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodSales').value = '100';
        document.getElementById('prodImgUrlInput').value = '';
        document.getElementById('prodImageFile').value = '';
        document.getElementById('prodDescription').value = '';
        
        currentEditingSpecs = [{ name: '標準規格', price: 0 }];
        currentEditingImages = [];
        renderSpecsContainer();
        renderImagePreviewContainer();

        if (id) {
            modalTitle.textContent = '編輯商品';
            const products = getStoredProducts();
            const prod = products.find(p => p.id === id);
            if (prod) {
                document.getElementById('prodEditId').value = prod.id;
                document.getElementById('prodName').value = prod.name;
                document.getElementById('prodCategory').value = prod.category;
                document.getElementById('prodPrice').value = prod.price;
                document.getElementById('prodSales').value = prod.sales;
                document.getElementById('prodDescription').value = prod.description || '';
                
                currentEditingSpecs = prod.specs ? prod.specs.map(s => ({ ...s })) : [{ name: '標準規格', price: prod.price }];
                renderSpecsContainer();

                currentEditingImages = prod.images ? [...prod.images] : [prod.img];
                renderImagePreviewContainer();
            }
        } else {
            modalTitle.textContent = '新增商品';
        }

        const modal = new bootstrap.Modal(document.getElementById('productModal'));
        modal.show();
    }

    function saveProduct() {
        const editId = document.getElementById('prodEditId').value;
        const name = document.getElementById('prodName').value.trim();
        const category = document.getElementById('prodCategory').value;
        const price = Number(document.getElementById('prodPrice').value);
        const sales = Number(document.getElementById('prodSales').value);
        const description = document.getElementById('prodDescription').value.trim();
        const specs = [...currentEditingSpecs];
        const images = currentEditingImages.length > 0 ? [...currentEditingImages] : ['https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=500&q=80'];
        const img = images[0]; // 第一張作為封面

        if (!name || isNaN(price)) {
            alert('請完整填寫商品名稱與正確價格！');
            return;
        }

        let products = getStoredProducts();
        if (editId) {
            products = products.map(p => p.id == editId ? { ...p, name, category, price, sales, specs, img, images, description } : p);
        } else {
            const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
            products.push({ id: newId, name, category, price, sales, specs, img, images, description });
        }

        saveStoredProducts(products);
        renderAdminProducts(currentAdminCategory);
        bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
        alert('商品儲存上架成功！');
    }

    function deleteProduct(id) {
        if (confirm('確定要刪除此商品嗎？')) {
            let products = getStoredProducts();
            products = products.filter(p => p.id !== id);
            saveStoredProducts(products);
            renderAdminProducts(currentAdminCategory);
        }
    }

    function renderOrders() {
        const tbody = document.getElementById('orderTableBody');
        tbody.innerHTML = '';
        let orders = JSON.parse(localStorage.getItem('shop_orders') || '[]');
        
        if(orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">目前尚無顧客訂單。</td></tr>`;
            document.getElementById('totalOrdersCount').innerText = '0';
            document.getElementById('totalSalesAmount').innerText = '$0';
            return;
        }

        let totalSales = 0;
        orders.forEach(o => {
            totalSales += o.total;
            tbody.innerHTML += `
                <tr>
                    <td><strong>${o.id}</strong></td>
                    <td>${o.customer}<br><small>${o.phone}</small></td>
                    <td>${o.items.map(i=> `${i.name} (${i.spec}) x${i.qty}`).join(', ')}</td>
                    <td class="text-primary fw-bold">$${o.total}</td>
                    <td><small>${o.date}</small></td>
                    <td><span class="badge bg-success">${o.status}</span></td>
                    <td><button class="btn btn-sm btn-outline-primary" onclick="alert('收件地址：${o.address}\\n付款方式：${o.paymentMethod}\\n備註：${o.orderNote || "無"}')">檢視</button></td>
                </tr>
            `;
        });
        document.getElementById('totalOrdersCount').innerText = orders.length;
        document.getElementById('totalSalesAmount').innerText = `$${totalSales}`;
    }

    // 渲染從前台送出的水電諮詢單到後台
    function renderRepairs() {
        const tbody = document.getElementById('repairTableBody');
        tbody.innerHTML = '';
        let repairs = JSON.parse(localStorage.getItem('shop_repairs') || '[]');

        if (repairs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-4">目前尚無維修諮詢單。</td></tr>`;
            return;
        }

        repairs.forEach((r, index) => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${r.id}</strong></td>
                    <td>${r.name}</td>
                    <td>${r.phone}</td>
                    <td><span class="badge bg-warning text-dark">${r.category}</span><br><small class="text-muted">時段: ${r.times}</small></td>
                    <td><small class="text-truncate-2" style="max-width: 200px;">${r.desc}</small></td>
                    <td><small>${r.date}</small></td>
                    <td><span class="badge bg-primary">${r.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="alert('諮詢項目：${r.category}\\n預約時段：${r.times}\\n詳細需求：\\n${r.desc}')">詳細</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteRepair(${index})">刪除</button>
                    </td>
                </tr>
            `;
        });
    }

    function deleteRepair(index) {
        if (confirm('確定要刪除此筆維修諮詢單嗎？')) {
            let repairs = JSON.parse(localStorage.getItem('shop_repairs') || '[]');
            repairs.splice(index, 1);
            localStorage.setItem('shop_repairs', JSON.stringify(repairs));
            renderRepairs();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderAdminCategoryTabs();
        renderAdminProducts('all');
        renderOrders();
        renderRepairs();
    });
</script>
</body>
</html>
